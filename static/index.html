<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncWave — Collaborative Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f0f1a;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== NAME MODAL ===== */
        .name-modal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
        }
        .name-modal.hidden { display: none; }
        .name-card {
            background: #1a1a2e; border: 1px solid #2a2a4a;
            border-radius: 16px; padding: 40px;
            width: 380px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .name-card h2 {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 6px;
            background: linear-gradient(135deg, #00d2ff, #7a5cff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .name-card p { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
        .name-card input {
            width: 100%; padding: 12px 16px;
            background: #12122a; border: 1px solid #333;
            border-radius: 8px; color: #fff; font-size: 1rem;
            font-family: 'Inter', sans-serif; outline: none;
            transition: border 0.2s;
        }
        .name-card input:focus { border-color: #7a5cff; }
        .name-card button {
            width: 100%; margin-top: 16px; padding: 12px;
            background: linear-gradient(135deg, #7a5cff, #00d2ff);
            border: none; border-radius: 8px; color: #fff;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s;
        }
        .name-card button:hover { opacity: 0.9; }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 24px;
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
        }
        .topbar-left { display: flex; align-items: center; gap: 14px; }
        .logo {
            font-size: 1.3rem; font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #7a5cff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .doc-title {
            background: transparent; border: 1px solid transparent;
            color: #ccc; font-size: 1rem; font-weight: 500;
            padding: 4px 10px; border-radius: 6px; outline: none;
            font-family: 'Inter', sans-serif; transition: border 0.2s;
        }
        .doc-title:hover, .doc-title:focus { border-color: #444; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }

        /* ===== AVATARS ===== */
        .avatars { display: flex; }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700; color: #fff;
            border: 2px solid #16213e; margin-left: -6px;
            cursor: default; position: relative;
            transition: transform 0.15s;
        }
        .avatar:first-child { margin-left: 0; }
        .avatar:hover { transform: scale(1.15); z-index: 2; }
        .avatar .tooltip {
            display: none; position: absolute; bottom: -28px; left: 50%;
            transform: translateX(-50%); background: #333; color: #fff;
            padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; white-space: nowrap;
        }
        .avatar:hover .tooltip { display: block; }

        /* ===== STATUS ===== */
        .status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
            background: rgba(255,255,255,0.05); border: 1px solid #333;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #ff4444;
            transition: background 0.3s;
        }
        .status-dot.on { background: #00ff88; }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 24px; background: #1e1e3a;
            border-bottom: 1px solid #2a2a4a; flex-shrink: 0;
        }
        .toolbar-info {
            font-size: 0.75rem; color: #666;
            font-family: 'JetBrains Mono', monospace;
        }

        /* AI STATUS */
        .ai-badge {
            margin-left: auto; display: flex; align-items: center; gap: 6px;
            padding: 3px 12px; border-radius: 16px; font-size: 0.75rem;
            background: rgba(122, 92, 255, 0.15); border: 1px solid rgba(122, 92, 255, 0.3);
            color: #bb99ff; transition: all 0.3s;
        }
        .ai-badge.loading { color: #ffd700; border-color: rgba(255, 215, 0, 0.3); background: rgba(255, 215, 0, 0.1); }
        .ai-badge.error { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.3); background: rgba(255, 107, 107, 0.1); }
        .ai-badge.success { color: #00ff88; border-color: rgba(0, 255, 136, 0.3); background: rgba(0, 255, 136, 0.1); }

        /* ===== OFFLINE BANNER ===== */
        .offline-banner {
            display: none; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(90deg, #e67e22, #f39c12);
            color: #fff; padding: 8px 24px;
            font-size: 0.82rem; font-weight: 600;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        /* ===== EDITOR ===== */
        .editor-wrap {
            flex: 1; display: flex; justify-content: center;
            overflow-y: auto; padding: 32px 20px; background: #0f0f1a;
        }
        .page {
            width: 100%; max-width: 816px; min-height: 1056px;
            background: #fff; border-radius: 6px;
            box-shadow: 0 4px 40px rgba(0,0,0,0.5);
            padding: 72px; position: relative;
        }
        #editor-host { position: relative; width: 100%; min-height: 900px; }
        #editor {
            width: 100%; min-height: 900px; border: none; outline: none;
            font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.8;
            color: #222; resize: none; background: transparent;
            position: relative; z-index: 2;
        }
        #ghost-text {
            position: absolute; top: 0; left: 0; right: 0;
            font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.8;
            color: transparent; white-space: pre-wrap; word-wrap: break-word;
            pointer-events: none; z-index: 1; overflow: hidden;
        }
        #ghost-text.has-suggestion { color: transparent; }
        #ghost-text .ghost-suggestion { color: #bbb; }

        /* ===== REMOTE CURSORS ===== */
        #cursors-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 3; overflow: hidden;
        }
        .remote-cursor {
            position: absolute; width: 2px; border-radius: 1px;
            animation: cursorPulse 1.2s ease-in-out infinite;
        }
        .remote-cursor-label {
            position: absolute; top: -20px; left: -2px;
            padding: 1px 6px; border-radius: 3px 3px 3px 0;
            font-size: 0.6rem; font-weight: 600; color: #fff;
            white-space: nowrap; font-family: 'Inter', sans-serif;
            line-height: 1.4; opacity: 0.9;
        }
        @keyframes cursorPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #caret-mirror {
            position: absolute; top: 0; left: 0;
            visibility: hidden; white-space: pre-wrap;
            word-wrap: break-word; overflow: hidden;
            pointer-events: none;
        }

        /* ===== BOTTOM BAR ===== */
        .bottombar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 24px;
            background: #16213e; border-top: 1px solid #2a2a4a;
            font-size: 0.72rem; color: #555; flex-shrink: 0;
        }
        .shortcuts { display: flex; gap: 16px; }
        .shortcuts kbd {
            background: #2a2a4a; padding: 1px 6px; border-radius: 3px;
            font-size: 0.68rem; color: #aaa; font-family: 'JetBrains Mono', monospace;
        }

        /* ===== ACTIVITY PANEL ===== */
        .activity-toggle {
            position: fixed; bottom: 24px; right: 24px;
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #7a5cff, #00d2ff);
            border: none; color: white; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(122, 92, 255, 0.4); z-index: 100;
            transition: transform 0.2s;
        }
        .activity-toggle:hover { transform: scale(1.1); }
        .activity-panel {
            display: none; position: fixed; bottom: 80px; right: 24px;
            width: 320px; max-height: 300px; background: #16213e;
            border: 1px solid #2a2a4a; border-radius: 12px;
            overflow-y: auto; padding: 16px; z-index: 100;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .activity-panel.open { display: block; }
        .activity-panel h4 {
            font-size: 0.72rem; text-transform: uppercase;
            letter-spacing: 1.5px; color: #7a5cff; margin-bottom: 10px;
        }
        .log-entry {
            font-size: 0.75rem; color: #888; padding: 3px 0;
            font-family: 'JetBrains Mono', monospace;
        }
        .log-entry .who { font-weight: 600; }
    </style>
</head>
<body>
    <!-- Name Entry Modal -->
    <div class="name-modal" id="nameModal">
        <div class="name-card">
            <h2>SyncWave</h2>
            <p>Enter your name to start collaborating</p>
            <input type="text" id="nameInput" placeholder="Your name..." maxlength="20" autofocus />
            <button id="nameSubmit">Start Editing</button>
        </div>
    </div>

    <div class="topbar">
        <div class="topbar-left">
            <div class="logo">SyncWave</div>
            <input class="doc-title" id="docTitle" value="Untitled Document" />
        </div>
        <div class="topbar-right">
            <div class="avatars" id="avatars"></div>
            <div class="status-pill">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <span class="toolbar-info" id="toolbarInfo">CRDT + AI</span>
        <div class="ai-badge" id="aiBadge">✨ AI Ready</div>
    </div>

    <div class="offline-banner" id="offlineBanner">
        ⚡ Offline Mode — Edits are saved locally and will sync when reconnected
    </div>

    <div class="editor-wrap">
        <div class="page">
            <div id="editor-host">
                <textarea id="editor" placeholder="Start typing... AI suggestions appear as grey text (press Tab to accept).&#10;&#10;Open another browser tab to collaborate in real time!"></textarea>
                <div id="ghost-text"></div>
                <div id="cursors-overlay"></div>
            </div>
        </div>
    </div>

    <div class="bottombar">
        <div class="shortcuts">
            <span><kbd>Tab</kbd> Accept AI suggestion</span>
            <span><kbd>Esc</kbd> Dismiss</span>
        </div>
        <span id="charCount">0 chars</span>
        <span>SyncWave — CRDT + AI</span>
    </div>

    <button class="activity-toggle" id="activityBtn" title="Activity Feed">💬</button>
    <div class="activity-panel" id="activityPanel">
        <h4>Activity Feed</h4>
        <div id="logContainer"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
