<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncWave — Documents</title>
    <style>
        :root {
            --bg: #0b0b1a;
            --panel: rgba(18, 18, 42, 0.72);
            --border: rgba(255,255,255,0.1);
            --text: #e9e9f8;
            --muted: #9ea1bf;
            --primary: #7c5cff;
            --accent: #00c8ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1000px 600px at 0% 0%, rgba(124,92,255,0.18), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(0,200,255,0.14), transparent 55%),
                var(--bg);
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }
        .shell {
            width: 100%;
            max-width: 980px;
        }
        .hero {
            margin-bottom: 16px;
        }
        .hero h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero p { color: var(--muted); margin: 8px 0 0; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            padding: 18px;
            box-shadow: 0 8px 36px rgba(0,0,0,0.3);
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        input, button {
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font: inherit;
            padding: 10px 12px;
        }
        input { min-width: 260px; flex: 1; }
        button { cursor: pointer; font-weight: 600; }
        .primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: white;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.07);
        }
        .row:first-child { border-top: none; }
        .meta { color: var(--muted); font-size: 0.85rem; }
        .link-btn {
            background: rgba(124,92,255,0.15);
            border-color: rgba(124,92,255,0.35);
        }
        .empty { color: var(--muted); padding: 10px 0; }
    </style>
</head>
<body>
    <div class="shell">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div class="hero" style="margin-bottom: 0;">
                <h1>SyncWave Documents</h1>
                <p>Create a document, then share the link to collaborate in real time with CRDT sync and AI assistance.</p>
            </div>
            
            <div class="auth-controls" id="authSection" style="display: flex; gap: 10px;">
                <input type="text" id="usernameInput" placeholder="Username" style="min-width: 120px;" />
                <input type="password" id="passwordInput" placeholder="Password" style="min-width: 120px;" />
                <button class="primary" id="loginBtn" style="background: rgba(124,92,255,0.15); border: 1px solid rgba(124,92,255,0.35); color: var(--text);">Login</button>
                <button class="primary" id="registerBtn">Register</button>
            </div>
            
            <div id="loggedInSection" style="display: none; align-items: center; gap: 14px;">
                <span style="color: var(--muted);">Welcome, <strong id="displayUsername" style="color: var(--accent);"></strong></span>
                <button class="link-btn" id="logoutBtn" style="padding: 6px 12px; font-size: 0.85rem;">Logout</button>
            </div>
        </div>

        <div class="card" id="documentCard" style="display: none;">
            <div class="controls">
                <input id="titleInput" placeholder="Untitled Document" maxlength="120" />
                <button class="primary" id="createBtn">Create New Document</button>
            </div>
            <div id="docsList"></div>
        </div>
        
        <div class="card" id="loginPromptCard" style="text-align: center; padding: 40px;">
            <h3 style="margin-top:0;">Please Register or Login to access documents.</h3>
            <p style="color: var(--muted); margin-bottom: 0;">Use the form in the top right to authenticate using securely hashed credentials.</p>
        </div>
    </div>

    <script>
    (function () {
        const createBtn = document.getElementById('createBtn');
        const titleInput = document.getElementById('titleInput');
        const docsList = document.getElementById('docsList');
        
        // Auth Elements
        const authSection = document.getElementById('authSection');
        const loggedInSection = document.getElementById('loggedInSection');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const displayUsername = document.getElementById('displayUsername');
        const documentCard = document.getElementById('documentCard');
        const loginPromptCard = document.getElementById('loginPromptCard');

        // Initial Auth State Check
        let currentUser = sessionStorage.getItem('syncwave_user');
        
        function updateUIState() {
            if (currentUser) {
                authSection.style.display = 'none';
                loggedInSection.style.display = 'flex';
                displayUsername.textContent = currentUser;
                documentCard.style.display = 'block';
                loginPromptCard.style.display = 'none';
                refresh(); // Load documents only if logged in
            } else {
                authSection.style.display = 'flex';
                loggedInSection.style.display = 'none';
                documentCard.style.display = 'none';
                loginPromptCard.style.display = 'block';
                usernameInput.value = '';
                passwordInput.value = '';
            }
        }

        async function handleRegister() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username || !password) return alert("Please enter both username and password");
            
            try {
                registerBtn.disabled = true;
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || 'Registration failed');
                }
                
                alert("Registered successfully! You can now log in.");
                
            } catch (err) {
                alert(err.message);
            } finally {
                registerBtn.disabled = false;
            }
        }

        async function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username || !password) return alert("Please enter both username and password");
            
            try {
                loginBtn.disabled = true;
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || 'Login failed');
                }
                
                // Set fake session state for frontend only MVP
                sessionStorage.setItem('syncwave_user', username);
                currentUser = username;
                updateUIState();
                
            } catch (err) {
                alert(err.message);
            } finally {
                loginBtn.disabled = false;
            }
        }
        
        function handleLogout() {
            sessionStorage.removeItem('syncwave_user');
            currentUser = null;
            updateUIState();
        }

        async function fetchDocs() {
            const res = await fetch('/api/docs?limit=50');
            if (!res.ok) throw new Error('Failed to fetch documents');
            return res.json();
        }

        function openDoc(id) {
            window.location.href = '/editor?doc_id=' + encodeURIComponent(id);
        }

        function renderDocs(items) {
            docsList.innerHTML = '';
            if (!items || items.length === 0) {
                const div = document.createElement('div');
                div.className = 'empty';
                div.textContent = 'No documents yet. Create your first one.';
                docsList.appendChild(div);
                return;
            }

            for (const doc of items) {
                const row = document.createElement('div');
                row.className = 'row';

                const left = document.createElement('div');
                const title = document.createElement('div');
                title.textContent = doc.title || 'Untitled Document';
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = 'ID: ' + doc.id + ' · Updated: ' + doc.updatedAt;
                left.appendChild(title);
                left.appendChild(meta);

                const openBtn = document.createElement('button');
                openBtn.className = 'link-btn';
                openBtn.textContent = 'Open';
                openBtn.onclick = function () { openDoc(doc.id); };

                row.appendChild(left);
                row.appendChild(openBtn);
                docsList.appendChild(row);
            }
        }

        async function refresh() {
            if (!currentUser) return;
            try {
                const data = await fetchDocs();
                renderDocs((data && data.documents) || []);
            } catch (err) {
                docsList.innerHTML = '<div class="empty">Failed to load documents.</div>';
            }
        }

        async function createDoc() {
            createBtn.disabled = true;
            try {
                const res = await fetch('/api/docs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: titleInput.value || '' })
                });
                if (!res.ok) throw new Error('Failed to create document');
                const data = await res.json();
                if (data && data.document && data.document.id) {
                    openDoc(data.document.id);
                }
            } catch (_) {
                alert('Could not create document right now.');
            } finally {
                createBtn.disabled = false;
            }
        }

        createBtn.addEventListener('click', createDoc);
        titleInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') createDoc();
        });
        
        loginBtn.addEventListener('click', handleLogin);
        registerBtn.addEventListener('click', handleRegister);
        logoutBtn.addEventListener('click', handleLogout);
        passwordInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleLogin();
        });

        // Initialize UI
        updateUIState();
    })();
    </script>
</body>
</html>
